# Host Nginx in front of the Docker Compose stack.
# Copy to /etc/nginx/sites-available/medislot and replace medislot.example.com.
# Certbot adds the HTTPS (port 443) server block and certificate paths.

limit_req_zone $binary_remote_addr zone=medislot_per_ip:10m rate=20r/s;

server {
    listen 80;
    server_name medislot.example.com;

    client_max_body_size 1m;

    location / {
        limit_req zone=medislot_per_ip burst=40 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append: whatever X-Forwarded-For the visitor sent is thrown
        # away, so nobody can pretend to be another IP to dodge the login rate limit.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
